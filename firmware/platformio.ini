; Lueftungs-Bruecke fuer Leipfinger-Bader LB-Lueftungssystem WE (ONE Touch Bus)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
