; Lueftungs-Bruecke fuer Leipfinger-Bader LB-Lueftungssystem WE (ONE Touch Bus)
[env:esp32dev]
; ESP32-DevKit + RS-485-Modul (MAX3485) mit DE/RE an GPIO4
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; M5Stack ATOM Lite + Atomic RS485 Base (RX G22, TX G19, automatische Senderichtung)
[env:atom]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBUS_RX=22
    -DBUS_TX=19
    -DBUS_DE=-1
    -DSTATUS_LED=-1
    -DSENS_SDA=26
    -DSENS_SCL=32
    -DFW_VARIANT=\"atom\"
